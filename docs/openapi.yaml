openapi: 3.0.3
info:
  title: FutBot API
  version: 0.3.0
  description: FutBot API.
servers:
- url: http://localhost:8000/api/v1
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Registrar usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - username
              - email
              - password
              properties:
                name:
                  type: string
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: Usuario registrado
        '400':
          description: Datos inválidos o duplicados
  /auth/login:
    post:
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Sesión iniciada
        '401':
          description: Credenciales inválidas
  /club/me:
    get:
      summary: Obtener mi club
      responses:
        '200':
          description: Club
    patch:
      summary: Modificar mi club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                avatar:
                  type: string
                friendlyAvailable:
                  type: boolean
      responses:
        '200':
          description: Club actualizado
  /players:
    get:
      summary: Listar jugadores
      responses:
        '200':
          description: Jugadores
    post:
      summary: Crear jugador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - power
              - agility
              - control
              - speed
              - strength
              description: Cada PACSS va de 20 a 100 y la suma debe ser 300.
              properties:
                name:
                  type: string
                power:
                  type: integer
                  minimum: 20
                  maximum: 100
                agility:
                  type: integer
                  minimum: 20
                  maximum: 100
                control:
                  type: integer
                  minimum: 20
                  maximum: 100
                speed:
                  type: integer
                  minimum: 20
                  maximum: 100
                strength:
                  type: integer
                  minimum: 20
                  maximum: 100
      responses:
        '201':
          description: Jugador creado
        '400':
          description: PACSS inválido
  /players/{playerId}:
    delete:
      summary: Eliminar jugador
      parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Jugador eliminado
        '403':
          description: El jugador no puede eliminarse
  /behaviours:
    get:
      summary: Listar comportamientos
      responses:
        '200':
          description: Comportamientos
    post:
      summary: Crear comportamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - code
              properties:
                name:
                  type: string
                code:
                  type: string
      responses:
        '201':
          description: Comportamiento creado
        '403':
          description: El club tiene un partido en curso
  /behaviours/{behaviourId}:
    patch:
      summary: Editar comportamiento
      parameters:
      - name: behaviourId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - code
              properties:
                name:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Comportamiento actualizado
        '403':
          description: No se puede editar ahora
    delete:
      summary: Eliminar comportamiento
      parameters:
      - name: behaviourId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Comportamiento eliminado
        '403':
          description: No se puede eliminar ahora
  /team/default:
    get:
      summary: Obtener equipo default
      responses:
        '200':
          description: Equipo default
    put:
      summary: Configurar equipo default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - playerIds
              - formation
              properties:
                playerIds:
                  type: array
                  minItems: 6
                  maxItems: 6
                  uniqueItems: true
                  items:
                    type: integer
                formation:
                  type: string
      responses:
        '200':
          description: Equipo actualizado
        '400':
          description: El equipo debe tener 6 jugadores válidos
  /leagues:
    get:
      summary: Listar ligas disponibles
      parameters:
      - name: name
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Ligas
    post:
      summary: Crear liga
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - type
              - minTeams
              - maxTeams
              - startDateTime
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                  - PUBLIC
                  - PRIVATE
                minTeams:
                  type: integer
                  minimum: 3
                maxTeams:
                  type: integer
                  minimum: 3
                startDateTime:
                  type: string
                  format: date-time
                accessCode:
                  type: string
      responses:
        '201':
          description: Liga creada
        '400':
          description: Configuración inválida
  /leagues/{leagueId}:
    get:
      summary: Obtener detalle de liga
      parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Liga, fixture y tabla de posiciones
  /leagues/{leagueId}/join:
    post:
      summary: Unirse a una liga
      description: Usa y congela los 6 jugadores del equipo default.
      parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accessCode:
                  type: string
      responses:
        '201':
          description: Club inscripto
        '409':
          description: Liga llena, código inválido o club ya inscripto
  /leagues/{leagueId}/leave:
    post:
      summary: Abandonar liga
      parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Club removido
        '409':
          description: La liga ya inició
  /leagues/{leagueId}/start:
    post:
      summary: Iniciar liga
      parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Liga iniciada y fixture generado
        '409':
          description: No se puede iniciar la liga
  /leagues/{leagueId}/cancel:
    post:
      summary: Cancelar liga
      parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Liga cancelada
        '409':
          description: No se puede cancelar la liga
  /matches/{matchId}:
    get:
      summary: Consultar partido
      description: Si está en curso, devuelve su estado actual.
      parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Partido
  /matches/{matchId}/lineup:
    put:
      summary: Configurar alineación
      parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - starters
              - substitutes
              - formation
              - behaviours
              properties:
                starters:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: integer
                substitutes:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: integer
                formation:
                  type: string
                behaviours:
                  type: object
                  additionalProperties:
                    type: integer
      responses:
        '200':
          description: Alineación guardada
        '400':
          description: Alineación inválida
  /matches/{matchId}/substitution:
    post:
      summary: Planificar o realizar cambio
      parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - playerOutId
              - playerInId
              - mode
              properties:
                playerOutId:
                  type: integer
                playerInId:
                  type: integer
                mode:
                  type: string
                  enum:
                  - PLAN
                  - APPLY
      responses:
        '200':
          description: Cambio aceptado
        '409':
          description: Cambio no permitido
    delete:
      summary: Anular cambio planificado
      parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Cambio anulado
  /matches/{matchId}/players/{playerId}/behaviour:
    patch:
      summary: Cambiar comportamiento de un jugador
      parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - behaviourId
              properties:
                behaviourId:
                  type: integer
      responses:
        '204':
          description: Comportamiento cambiado
  /friendly-matches:
    get:
      summary: Listar amistosos disponibles
      responses:
        '200':
          description: Amistosos
    post:
      summary: Crear amistoso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - startDateTime
              properties:
                startDateTime:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Amistoso creado
  /friendly-matches/{matchId}/join:
    post:
      summary: Unirse a un amistoso
      parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Club unido al partido
        '409':
          description: Partido completo
  /leaderboard:
    get:
      summary: Consultar ranking global
      responses:
        '200':
          description: Ranking
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
